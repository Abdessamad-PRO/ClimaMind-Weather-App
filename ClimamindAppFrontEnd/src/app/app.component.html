<!-- Arrière-plan animé -->
<app-background-anim></app-background-anim>

<!-- Conteneur Principal Glassmorphism -->
<main class="main-glass-container glass-panel">
  
  <!-- COLONNE GAUCHE (Sidebar) -->
  <aside class="sidebar-column">
    
    <!-- Logo -->
    <div class="brand-logo">
      <div class="logo-icon">
        <i class="fa-solid fa-cloud-bolt"></i>
      </div>
      <span class="brand-name">Weather<span class="light">Wise</span></span>
    </div>

    <!-- Carte Métrique AQI -->
    <ng-container *ngIf="currentWeather$ | async as weather">
      <app-air-quality [aqi]="weather.aqi" [status]="weather.aqiStatus"></app-air-quality>
      
    </ng-container>

    <!-- Carte Interactive Leaflet -->
    <app-world-map></app-world-map>


  </aside>

  <!-- COLONNE DROITE (Contenu Météo Principal) -->
  <section class="content-column">
    
    <!-- Barre Supérieure -->
    <ng-container *ngIf="currentWeather$ | async as weather">
      <app-header-actions 
        [locationName]="weather.city + ', ' + weather.country"
        [currentDate]="weather.date"
        (searchRequested)="openSearchPrompt()">
      </app-header-actions>
    
    </ng-container>

    <!-- Section Métriques & Recherches Récentes -->
    <div class="hero-grid">
      
      <!-- Temperature Hero -->
      <ng-container *ngIf="currentWeather$ | async as weather">
        <app-current-weather
          [temp]="weather.temperature"
          [high]="weather.tempHigh"
          [low]="weather.tempLow"
          [description]="weather.description">
        </app-current-weather>
        
      </ng-container>

      <!-- Colonne Description & Villes Récentes -->
      <div class="side-info">
        <p class="description-text">
          With real time data and advanced technology we provide reliable forecasts for any location around the world.
        </p>

        <app-recent-searches
          *ngIf="recentCities$ | async as cities"
          [cities]="cities"
          (citySelected)="onCitySelected($event)">
        </app-recent-searches>
       
      </div>

    </div>

    <!-- Graphique à Vague Hebdomadaire -->
    <app-forecast-wave 
      *ngIf="dailyForecast$ | async as forecast"
      [forecast]="forecast">
    </app-forecast-wave>

  </section>

</main>
