<header class="header">
  <div class="location-info" *ngIf="city">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
    </svg>
    <span class="city-name">{{ city }}, {{ country }}</span>
    <span class="date-time">{{ currentDateTime }}</span>
  </div>

  <div class="search-wrapper" [class.open]="searchOpen">
    <div class="search-box">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input
        #searchInput
        type="text"
        placeholder="Search city..."
        [(ngModel)]="query"
        (ngModelChange)="onQueryChange($event)"
        (focus)="searchOpen = true"
        (keydown.escape)="closeSearch()"
      />
      <button class="clear-btn" *ngIf="query" (click)="clearSearch()">✕</button>
    </div>

    <div class="search-results" *ngIf="searchOpen && results.length > 0">
      <div
        class="result-item"
        *ngFor="let r of results"
        (click)="selectResult(r)"
      >
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" opacity="0.5">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
        </svg>
        <span class="result-name">{{ r.name }}</span>
        <span class="result-country">{{ r.state ? r.state + ', ' : '' }}{{ r.country }}</span>
      </div>
    </div>
  </div>

  <div class="header-actions">
    <button class="action-btn" (click)="onRefresh.emit()" title="Refresh">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
    </button>
    <button class="action-btn download-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Download App
    </button>
  </div>
</header>
