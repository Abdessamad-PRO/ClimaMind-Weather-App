<div class="forecast-band" *ngIf="weather">
      <div class="forecast-row"
        *ngFor="let day of weather.forecast; let i = index"
        [class.today]="i === 0"
      >
        <!-- Jour -->
        <span class="day-name">{{ i === 0 ? "Aujourd'hui" : day.dayName }}</span>

        <!-- Icône + précip -->
        <div class="icon-cell">
          <span class="day-icon">{{ getIcon(day) }}</span>
          <span class="precip" *ngIf="day.precipitation > 0">{{ day.precipitation }}%</span>
        </div>

        <!-- Temp min -->
        <span class="t-min">{{ getTemp(day.tempMin) }}</span>

        <!-- Barre de température style Apple -->
        <div class="bar-track" #barContainer>
          <div class="bar-fill"
            [style.left.%]="getBarLeft(day)"
            [style.width.%]="getBarWidth(day)"
            [style.background]="getBarGradient(day)"
          ></div>
          <div class="bar-dot" [style.left.%]="getCurrentDot(day, i)"></div>
        </div>

        <!-- Temp max -->
        <span class="t-max">{{ getTemp(day.tempMax) }}</span>
      </div>
    </div>
