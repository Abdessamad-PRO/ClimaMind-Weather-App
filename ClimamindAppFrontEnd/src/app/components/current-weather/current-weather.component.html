<div class="current-weather" *ngIf="weather">
  <div class="temp-block">
    <div class="temp-main">
      <span class="temp-value">{{ weather.temperature }}</span>
      <div class="temp-meta">
        <span class="temp-unit">°C</span>
        <span class="feels-like">Feels {{ weather.feelsLike }}°</span>
      </div>
    </div>
  </div>

  <div class="condition-block">
    <h1 class="condition-text">{{ getConditionLabel() }}</h1>
    <p class="condition-desc">{{ weather.description | titlecase }}</p>
  </div>

  <div class="weather-stats">
    <div class="stat">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2v20M2 12h20"/>
      </svg>
      <span class="stat-label">Humidity</span>
      <span class="stat-val">{{ weather.humidity }}%</span>
    </div>
    <div class="stat">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/>
      </svg>
      <span class="stat-label">Wind</span>
      <span class="stat-val">{{ weather.windSpeed }} km/h</span>
    </div>
    <div class="stat">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
      </svg>
      <span class="stat-label">Visibility</span>
      <span class="stat-val">{{ weather.visibility }} km</span>
    </div>
    <div class="stat">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22V12M12 12C12 12 8 8.5 8 6a4 4 0 0 1 8 0c0 2.5-4 6-4 6z"/>
      </svg>
      <span class="stat-label">Pressure</span>
      <span class="stat-val">{{ weather.pressure }} hPa</span>
    </div>
  </div>
</div>
